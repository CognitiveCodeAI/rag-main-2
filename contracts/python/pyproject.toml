[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "npr-contracts"
version = "1.0.0"
description = "JSON Schema validation for NPR RAG system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["npr_contracts*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
